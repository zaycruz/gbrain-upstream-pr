name: Retrieval Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retrieval-gate:
    # Hermetic pre-merge check. Clones e2e.yml's proven pattern: provision a real
    # Postgres, set DATABASE_URL, hard-fail if absent. Difference vs e2e: this job
    # seeds a committed fixture brain and runs the 100-question eval --thresholds
    # against the PR's code (NOT prod). A retrieval regression on the PR fails the
    # merge even when prod is still green.
    name: Hermetic retrieval regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_retrieval_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e9912e16dfe367  # v5
        with:
          python-version: "3.12"
      - name: Require DATABASE_URL (no silent skip)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_retrieval_gate
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL must be set for the retrieval-gate job — a silent skip would let a retrieval regression merge green. Failing the job." >&2
            exit 1
          fi
      - name: Seed fixture brain from committed snapshot
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_retrieval_gate
        run: bun run scripts/seed-eval-fixture.ts
      - name: Run 100-question retrieval eval against PR build (hard gate)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_retrieval_gate
        run: python3 tools/eval/run_eval.py --thresholds
