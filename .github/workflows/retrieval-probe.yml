name: Retrieval Probe (prod)

on:
  schedule:
    - cron: '0 7 * * *'  # Nightly at 7am UTC — catches data/corpus rot, not code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-prod
  cancel-in-progress: false

jobs:
  live-probe:
    # Live-probe gate: runs the SAME 100-question eval against PRODUCTION, on a
    # schedule, to catch corpus/data rot that the hermetic pre-merge gate cannot
    # see (e.g. a page deleted, a source de-synced, a rollup stopped). Distinct
    # from retrieval-gate.yml, which tests the PR's code hermetically. This job
    # needs a prod DB connection string stored as the GBRAIN_PROD_DATABASE_URL
    # repo secret; it hard-fails if the secret is absent so the monitor never
    # silently goes dark.
    name: Nightly prod retrieval probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e9912e16dfe367  # v5
        with:
          python-version: "3.12"
      - name: Require prod DATABASE_URL secret (no silent skip)
        env:
          PROD_URL: ${{ secrets.GBRAIN_PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "::error::GBRAIN_PROD_DATABASE_URL secret is not set — the prod probe would silently go dark. Set the secret or delete this workflow. Failing." >&2
            exit 1
          fi
      - name: Link gbrain CLI at prod DB
        env:
          DATABASE_URL: ${{ secrets.GBRAIN_PROD_DATABASE_URL }}
        run: bun link
      - name: Run 100-question eval against prod (alert on gate fail)
        env:
          DATABASE_URL: ${{ secrets.GBRAIN_PROD_DATABASE_URL }}
        run: python3 tools/eval/run_eval.py --thresholds
